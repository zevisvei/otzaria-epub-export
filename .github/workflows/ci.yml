name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unit tests + epubcheck on sample books
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip -d "$RUNNER_TEMP"
          tools/check_samples.sh "$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # בלי סודות: אימות בלבד (כמו החנות), עם תגובת סיכום על ה-PR
      - uses: Otzaria/otzaria-plugin-validator@v1
        with:
          fail-on-warnings: 'true'
          pr-comment: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ github.token }}
