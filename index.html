<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ייצוא EPUB</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>ייצוא EPUB</h1>
      <span class="topbar-subtitle">ספר אלקטרוני מימין לשמאל מספרי אוצריא</span>
      <span class="topbar-spacer"></span>
      <button class="topbar-btn" id="aboutBtn" title="אודות" aria-label="אודות">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      </button>
    </header>

    <main class="app-content" id="main" tabindex="-1">
      <div class="page">
        <!-- הוספת ספרים -->
        <section class="section">
          <div class="section-head"><h2>הוספת ספר</h2></div>
          <div class="search-row">
            <input type="search" id="searchInput" class="field" placeholder="חיפוש ספר לפי שם…" autocomplete="off" aria-label="חיפוש ספר" />
          </div>
          <div id="searchResults" class="results" aria-live="polite"></div>
        </section>

        <!-- הספרים בקובץ -->
        <section class="section">
          <div class="section-head">
            <h2>ספרים בקובץ</h2>
            <span class="muted small" id="booksCount"></span>
          </div>
          <div id="bookList"></div>
        </section>

        <!-- הגדרות -->
        <section class="section">
          <div class="section-head"><h2>הגדרות הקובץ</h2></div>
          <div class="card options">
            <label class="opt-wide">
              <span class="opt-label">שם הספר בקובץ</span>
              <input type="text" id="optTitle" class="field" placeholder="ייקבע לפי הספרים שנבחרו" />
            </label>
            <div class="opt-grid">
              <label class="check"><input type="checkbox" id="optCover" checked /> כריכה מעוצבת</label>
              <label class="check"><input type="checkbox" id="optTitlePage" checked /> דף שער</label>
              <label class="check"><input type="checkbox" id="optRightsPage" checked /> דף פרטים וזכויות</label>
              <label class="check"><input type="checkbox" id="optRemoveTeamim" /> הסרת טעמים</label>
              <label class="check"><input type="checkbox" id="optRemoveNikud" /> הסרת ניקוד</label>
            </div>
            <fieldset class="opt-set">
              <legend>הצגת המפרשים</legend>
              <label class="radio"><input type="radio" name="notesMode" value="popup" checked />
                <span><b>חלונית בלבד</b> <span class="muted small">— סימן קטן בטקסט, והפירוש מופיע רק בלחיצה עליו (Apple Books, Kobo, Google Play Books, KOReader). בקורא שאינו תומך בחלוניות ההערות יופיעו בקטן בסוף הפרק.</span></span></label>
              <label class="radio"><input type="radio" name="notesMode" value="endnotes" />
                <span><b>הערות בסוף הספר</b> <span class="muted small">— לחיצה פותחת חלונית; הטקסט שמור בקובצי הערות נפרדים בסוף הספר ואינו מופיע באף פרק, בכל קורא.</span></span></label>
              <label class="radio"><input type="radio" name="notesMode" value="line" />
                <span><b>מתחת לכל קטע</b> <span class="muted small">— הפירוש מופיע מיד אחרי הפסוק/הקטע, בגופן נפרד.</span></span></label>
              <label class="radio"><input type="radio" name="notesMode" value="chapter" />
                <span><b>בסוף כל פרק</b> <span class="muted small">— הערות ממוספרות בסוף הפרק, בגופן נפרד.</span></span></label>
            </fieldset>
            <label class="opt-wide">
              <span class="opt-label">גופן המפרשים</span>
              <select id="optNotesFont" class="field">
                <option value="rashi">כתב רש״י (מוטמע בקובץ)</option>
                <option value="book">גופן הספר, קטן יותר</option>
              </select>
            </label>
          </div>
        </section>

        <div class="export-row">
          <button class="btn btn-primary btn-lg" id="exportBtn" disabled>יצירת קובץ EPUB</button>
          <span class="muted small" id="exportHint">הוסיפו לפחות ספר אחד</span>
        </div>
      </div>
    </main>
  </div>

  <!-- התקדמות -->
  <div id="busy" class="busy" role="status" aria-live="polite" hidden>
    <div class="busy-card">
      <span class="spinner" aria-hidden="true"></span>
      <div class="busy-text" id="busyText"></div>
      <div class="busy-bar"><span id="busyBar"></span></div>
      <button class="btn" id="cancelBtn">ביטול</button>
    </div>
  </div>

  <dialog id="aboutDlg" class="dlg">
    <h2>ייצוא EPUB</h2>
    <p id="aboutText"></p>
    <p class="muted small">גופן כתב רש״י: Noto Rashi Hebrew, ברישיון <a href="assets/fonts/OFL.txt" target="_blank">SIL OFL 1.1</a>.</p>
    <form method="dialog"><button class="btn">סגירה</button></form>
  </dialog>

  <script src="js/core.js"></script>
  <script src="js/bookcss.js"></script>
  <script src="js/font-rashi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
