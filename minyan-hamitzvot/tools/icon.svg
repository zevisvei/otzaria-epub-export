<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- אייקון בסגנון תוספי חנות אוצריא: מסגרת ספר פתוח מוזהבת וסמל במרכז (תרי״ג בתוך ספר) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ede4"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fbe9a6"/>
      <stop offset="0.28" stop-color="#e2b84e"/>
      <stop offset="0.55" stop-color="#b8861f"/>
      <stop offset="0.78" stop-color="#e7c25c"/>
      <stop offset="1" stop-color="#8f6512"/>
    </linearGradient>
    <linearGradient id="goldDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d67e"/>
      <stop offset="0.5" stop-color="#b07e1a"/>
      <stop offset="1" stop-color="#d9ac43"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f6eed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6b4a0c" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6b4a0c" flood-opacity="0.35"/>
    </filter>
    <path id="book" d="M256 128 C214 98 140 90 78 103 L78 404 C140 392 214 399 256 428 C298 399 372 392 434 404 L434 103 C372 90 298 98 256 128 Z"/>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g filter="url(#shadow)" fill="none" stroke-linejoin="round">
    <!-- מסגרת הספר: קו חיצוני עבה, קו פנימי וקו דק -->
    <use href="#book" stroke="url(#gold)" stroke-width="20"/>
    <use href="#book" stroke="#fff6d8" stroke-width="3" opacity="0.7"/>
    <use href="#book" transform="translate(256 266) scale(0.86) translate(-256 -266)" stroke="url(#gold)" stroke-width="9"/>
    <use href="#book" transform="translate(256 266) scale(0.78) translate(-256 -266)" stroke="url(#goldDeep)" stroke-width="3.5"/>
  </g>

  <g filter="url(#soft)" font-family="'Noto Serif Hebrew', 'FrankRuhlCLM', serif" font-weight="900" text-anchor="middle" fill="url(#gold)" stroke="#8f6512" stroke-width="2">
    <text x="256" y="300" font-size="120">תרי״ג</text>
  </g>
  <g fill="url(#goldDeep)">
    <rect x="186" y="330" width="140" height="7" rx="3.5"/>
    <rect x="206" y="348" width="100" height="7" rx="3.5"/>
  </g>
</svg>
