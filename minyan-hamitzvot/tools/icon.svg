<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- סגנון תוספי חנות אוצריא: מסגרת ספר פתוח מוזהבת, קו כפול מובלט, וסמל מוזהב במרכז (תרי״ג) -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.35" stop-color="#e0b44a"/>
      <stop offset="0.65" stop-color="#b9861f"/>
      <stop offset="1" stop-color="#e9c35c"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dc86"/>
      <stop offset="0.45" stop-color="#c8952b"/>
      <stop offset="1" stop-color="#9a6c14"/>
    </linearGradient>
    <linearGradient id="fillGold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fbe9a8"/>
      <stop offset="0.4" stop-color="#e3b84f"/>
      <stop offset="0.75" stop-color="#bf8c24"/>
      <stop offset="1" stop-color="#e5bf58"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#5a3d08" flood-opacity="0.32"/>
    </filter>
    <filter id="blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5a3d08" flood-opacity="0.35"/>
    </filter>
    <!-- הדף הפנימי: חריץ השדרה למעלה ולמטה -->
    <path id="page" d="M235 105 H550 L600 150 L650 105 H965 V655 H650 L600 700 L550 655 H235 Z"/>
    <!-- הכריכה: נראית בצדדים ובתחתית -->
    <path id="cover" d="M235 205 H140 V760 H550 L600 805 L650 760 H1060 V205 H965"/>
  </defs>

  <rect x="-100" y="-100" width="1400" height="1100" fill="#ffffff"/>

  <g filter="url(#shadow)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- כל קו: צינור זהב עבה — שוליים כהים, גוף מוזהב ופס אור עליון -->
    <use href="#cover" stroke="#7a5410" stroke-width="62"/>
    <use href="#cover" stroke="url(#gold)" stroke-width="52"/>
    <use href="#cover" stroke="#fff6d6" stroke-width="16" opacity="0.65" filter="url(#blur)" transform="translate(-3 -8)"/>
    <use href="#page" fill="#ffffff" stroke="#7a5410" stroke-width="62"/>
    <use href="#page" stroke="url(#gold)" stroke-width="52"/>
    <use href="#page" stroke="#fff6d6" stroke-width="16" opacity="0.65" filter="url(#blur)" transform="translate(-3 -8)"/>
    <!-- קו פנימי דק -->
    <use href="#page" transform="translate(600 402) scale(0.86) translate(-600 -402)" stroke="#8f6512" stroke-width="16"/>
    <use href="#page" transform="translate(600 402) scale(0.86) translate(-600 -402)" stroke="url(#goldSide)" stroke-width="11"/>
  </g>

  <g filter="url(#soft)" transform="translate(600 402) scale(1.08) translate(-600 -405)">
    <text x="600" y="455" text-anchor="middle" font-family="'Noto Serif Hebrew', 'FrankRuhlCLM', serif" font-weight="900" font-size="210" fill="url(#fillGold)" stroke="#8f6512" stroke-width="5" stroke-linejoin="round">תרי״ג</text>
    <g fill="url(#goldSide)">
      <rect x="430" y="500" width="340" height="14" rx="7"/>
      <rect x="480" y="534" width="240" height="12" rx="6"/>
    </g>
  </g>
</svg>
